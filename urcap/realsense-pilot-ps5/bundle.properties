# The OSGi bundle identity of the PolyScope 5 (e-Series) RealSense Pilot URCap.
# urcap/urcap5.py writes these into META-INF/MANIFEST.MF; Import-Package is derived
# from the compiled classes (jdeps), never hand-listed.
Bundle-SymbolicName=com.olympuscontrols.realsensepilot
Bundle-Name=RealSense Pilot
Bundle-Vendor=Olympus Controls
Bundle-Version=0.2.0
Bundle-Activator=com.olympuscontrols.realsensepilot.Activator
Bundle-Description=Wrist RealSense feed: tap a point to send the arm there (Installation), and the RealSense Pick program node
# PolyScope 5's URCap loader requires both flags (BundleInfo / URCapBundleCompatibilityValidatorImpl).
URCapCompatibility-CB3=false
URCapCompatibility-eSeries=true
# The URCap API version PolyScope reads from the embedded META-INF/maven/**/pom.xml
# (PomXMLAPIVersionParser: the com.ur.urcap:api dependency's <version>).
urcap.api.version=1.9.0
