<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PERCEPTION · RGB-D cockpit</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23020403'/><circle cx='16' cy='16' r='9' fill='none' stroke='%237CF7A2' stroke-width='2'/><circle cx='16' cy='16' r='2' fill='%237CF7A2'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<!--
  The cockpit as a ship's computer: one phosphor, a teletype, a prompt.
  Zero dependencies. WebGL2 does the picture — the wrist colour feed through a
  CRT shader (VIS / TRUE), the raw depth as a contour map (RANGE), and an
  orbiting point cloud straight from the depth texture (the SCAN panel). The
  API is the classic page's (/classic keeps every control this one leaves out:
  hand-eye calibration, tables, depth range).
-->
<style>
  :root {
    --void: #020403; --glass: #040806;
    --phos: #7CF7A2; --phos-hi: #D9FFE6; --phos-mid: #3FA768; --phos-dim: #1C4A30; --phos-ghost: #0E2418;
    --amber: #FFB547; --amber-dim: #6B4A1C; --red: #FF4A3D; --red-dim: #5A1712;
    --mono: "Share Tech Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --tty: "VT323", "Share Tech Mono", ui-monospace, monospace;
    --glow: 0 0 6px rgba(124,247,162,.55), 0 0 18px rgba(124,247,162,.18);
    --arn: 1.7667;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 38%, #06110b 0%, var(--void) 62%);
    color: var(--phos); font-family: var(--mono); font-size: 13px; letter-spacing: .06em;
    display: grid; grid-template-rows: auto 1fr auto; overflow: hidden;
    text-transform: uppercase;
  }
  body::after {  /* the glass: faint scanlines over everything that is not WebGL */
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.16) 2px 3px);
    mix-blend-mode: multiply;
  }
  ::selection { background: var(--phos); color: var(--void); }
  a { color: inherit; }

  /* ---- top line ---- */
  header { display: flex; align-items: center; gap: 22px; padding: 14px 24px 10px; }
  .ident { font-size: 12px; color: var(--phos-mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ident b { color: var(--phos); font-weight: 400; text-shadow: var(--glow); letter-spacing: .32em; margin-right: 14px; }
  .lamps { display: flex; gap: 6px; margin-left: auto; }
  .lamp { font-size: 11px; padding: 2px 7px; border: 1px solid var(--phos-ghost); color: var(--phos-dim); transition: color .25s, border-color .25s, box-shadow .25s; }
  .lamp.on { color: var(--phos); border-color: var(--phos-mid); text-shadow: var(--glow); box-shadow: inset 0 0 8px rgba(124,247,162,.12); }
  .lamp.alert { color: var(--amber); border-color: var(--amber); text-shadow: 0 0 6px rgba(255,181,71,.6); animation: blink 1.1s steps(2) infinite; }
  .lamp.crit { color: var(--red); border-color: var(--red); text-shadow: 0 0 8px rgba(255,74,61,.7); animation: blink .6s steps(2) infinite; }
  .clock { font-size: 12px; color: var(--phos-mid); min-width: 9ch; text-align: right; }
  @keyframes blink { 50% { opacity: .35; } }

  /* ---- the screen ---- */
  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; padding: 26px 24px 0; min-height: 0; }
  .screen { position: relative; align-self: start; justify-self: center;
            width: min(100%, calc((100dvh - 256px) * var(--arn))); aspect-ratio: var(--arn); }
  .screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ov { cursor: none; }
  .frame-tag { position: absolute; top: -18px; left: 2px; font-size: 11px; color: var(--phos-dim); display: flex; gap: 16px; width: 100%; }
  .frame-tag .r { margin-left: auto; margin-right: 4px; }
  .modes { display: inline-flex; gap: 10px; }
  .modes span { cursor: pointer; }
  .modes span.sel { color: var(--phos); text-shadow: var(--glow); }
  .modes span.sel::before { content: "▸"; margin-right: 3px; }
  #nosignal { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--tty); font-size: 28px;
              color: var(--amber); text-shadow: 0 0 10px rgba(255,181,71,.6); letter-spacing: .3em; pointer-events: none; }
  #nosignal[hidden] { display: none; }

  aside { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .tile { position: relative; border: 1px solid var(--phos-ghost); background: var(--glass); }
  .tile .lbl { position: absolute; left: 7px; top: 5px; font-size: 10.5px; color: var(--phos-mid); z-index: 2; pointer-events: none; text-shadow: 0 0 4px #000; }
  .tile .lbl.r { left: auto; right: 7px; }
  .tile::before, .tile::after { content: ""; position: absolute; width: 9px; height: 9px; border: 1px solid var(--phos-mid); z-index: 2; pointer-events: none; }
  .tile::before { left: -1px; top: -1px; border-right: 0; border-bottom: 0; }
  .tile::after { right: -1px; bottom: -1px; border-left: 0; border-top: 0; }
  #scanTile { aspect-ratio: 4 / 3; }
  #scan { width: 100%; height: 100%; display: block; }
  .view { aspect-ratio: 4 / 3; overflow: hidden; }
  .view img { width: 100%; height: 100%; object-fit: cover; display: block;
              filter: grayscale(1) sepia(1) hue-rotate(78deg) saturate(2.6) brightness(.9) contrast(1.25); opacity: .92; }
  .view.wait img { opacity: 0; }
  .view[hidden] { display: none; }

  /* ---- teletype + prompt ---- */
  footer { padding: 10px 24px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 24px; align-items: end; }
  #tty { font-family: var(--tty); font-size: 21px; line-height: 1.02; height: calc(5 * 1.02em); overflow: hidden;
         display: flex; flex-direction: column; justify-content: flex-end; letter-spacing: .04em;
         -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 60%); mask-image: linear-gradient(to bottom, transparent 0, #000 60%); }
  #tty .ln { flex: none; white-space: pre; overflow: hidden; text-overflow: ellipsis; text-shadow: var(--glow); }
  #tty .ln .ts { color: var(--phos-dim); margin-right: 1.2ch; text-shadow: none; }
  #tty .ln.warn { color: var(--amber); text-shadow: 0 0 7px rgba(255,181,71,.55); }
  #tty .ln.crit { color: var(--red); text-shadow: 0 0 8px rgba(255,74,61,.6); }
  #tty .ln.you { color: var(--phos-mid); text-shadow: none; }
  #tty .ln.dim { color: var(--phos-mid); text-shadow: none; }
  .prompt { grid-column: 1; display: flex; align-items: center; gap: 1ch; font-family: var(--tty); font-size: 24px; }
  .prompt .gt { color: var(--phos); text-shadow: var(--glow); }
  #cmd { flex: 1; background: transparent; border: 0; outline: 0; color: var(--phos-hi); font: inherit; letter-spacing: .06em;
         text-transform: uppercase; caret-color: var(--phos); text-shadow: var(--glow); padding: 0; min-width: 0; caret-shape: block; }
  #cmd::placeholder { color: var(--phos-dim); text-shadow: none; }
  .keys { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 10px; align-items: end; }
  button { font: inherit; font-size: 13px; letter-spacing: .18em; color: var(--phos); background: transparent; cursor: pointer;
           border: 1px solid var(--phos-dim); padding: 9px 14px; text-transform: uppercase; transition: background .15s, color .15s, box-shadow .15s; }
  button:hover:not(:disabled) { border-color: var(--phos); box-shadow: 0 0 12px rgba(124,247,162,.25), inset 0 0 10px rgba(124,247,162,.12); text-shadow: var(--glow); }
  button:active:not(:disabled) { background: var(--phos); color: var(--void); }
  button:disabled { color: var(--phos-ghost); border-color: var(--phos-ghost); cursor: default; }
  button:focus-visible { outline: 1px solid var(--phos-hi); outline-offset: 3px; }
  #stopKey { color: var(--red); border-color: var(--red); font-size: 17px; padding: 14px 26px; letter-spacing: .3em;
             box-shadow: 0 0 16px rgba(255,74,61,.25), inset 0 0 12px rgba(255,74,61,.15); text-shadow: 0 0 8px rgba(255,74,61,.7); }
  #stopKey:hover { box-shadow: 0 0 26px rgba(255,74,61,.5), inset 0 0 14px rgba(255,74,61,.3); border-color: var(--red); }
  #stopKey:active { background: var(--red); color: var(--void); }

  @media (max-width: 900px) {
    body { overflow: auto; }
    main { grid-template-columns: 1fr; padding: 0 16px; }
    .screen { width: 100%; }
    aside { flex-direction: row; flex-wrap: wrap; }
    aside .tile { flex: 1 1 140px; }
    header { padding: 12px 16px 8px; flex-wrap: wrap; gap: 10px; }
    .lamps { margin-left: 0; }
    footer { grid-template-columns: 1fr; padding: 10px 16px 16px; }
    .keys { grid-column: 1; grid-row: auto; flex-wrap: wrap; }
    #tty { font-size: 18px; }
  }
  @media (prefers-reduced-motion: reduce) { .lamp.alert, .lamp.crit { animation: none; } }
</style>
</head>
<body>
<header>
  <div class="ident"><b>PERCEPTION</b><span id="ident">— ESTABLISHING LINK —</span></div>
  <div class="lamps">
    <span class="lamp" id="lCam" title="camera streaming">CAM</span>
    <span class="lamp" id="lLink" title="robot controller answers">LINK</span>
    <span class="lamp" id="lPwr" title="robot mode RUNNING">PWR</span>
    <span class="lamp" id="lSafe" title="safety NORMAL">SAFE</span>
    <span class="lamp" id="lRmt" title="control mode REMOTE (needed for motion)">RMT</span>
  </div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<main>
  <div class="screen" id="screen">
    <div class="frame-tag">
      <span class="modes" id="modes"><span data-m="VIS" class="sel">VIS</span><span data-m="TRUE">TRUE</span><span data-m="RANGE">RANGE</span></span>
      <span class="r" id="feedTag">— · —</span>
    </div>
    <canvas id="gl"></canvas>
    <canvas id="ov"></canvas>
    <div id="nosignal">NO SIGNAL</div>
  </div>
  <aside>
    <div class="tile" id="scanTile"><span class="lbl">RANGE SCAN</span><span class="lbl r" id="scanTag">—</span><canvas id="scan"></canvas></div>
    <div class="tile view wait" id="view0" hidden><span class="lbl" id="view0Name">VIEW 1</span><img id="view0Img" alt=""></div>
    <div class="tile view wait" id="view1" hidden><span class="lbl" id="view1Name">VIEW 2</span><img id="view1Img" alt=""></div>
  </aside>
</main>

<footer>
  <div id="tty" aria-live="polite"></div>
  <label class="prompt"><span class="gt">&gt;</span><input id="cmd" autocomplete="off" spellcheck="false" placeholder="HELP" aria-label="command"></label>
  <div class="keys">
    <button id="kStart" title="power on + brake release (START)">Start</button>
    <button id="kFind" title="pick out the nearest object (FIND)">Find</button>
    <button id="kGo" disabled title="over the object, down to the standoff, back (APPROACH)">Approach</button>
    <button id="stopKey" title="stop all motion now (STOP, or Esc twice)">Stop</button>
  </div>
</footer>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clock = () => new Date().toLocaleTimeString([], { hour12: false });
  const f3 = (v, d = 3) => (v === null || v === undefined || Number.isNaN(v)) ? '—' : (v >= 0 ? '+' : '') + v.toFixed(d);
  const vec = (v, d = 3) => v ? v.map((x) => f3(x, d)).join(' ') : '—';
  const S = {
    seq: 0, running: true, header: null, depth: null, feat: null, maskSeq: 0, hover: null, drag: null, box: null,
    robot: null, located: null, mode: 'VIS', lastEvent: 0, state: null, confirm: null, busy: false,
    acquiredAt: 0, frameAt: 0, cloudCentre: [0, 0, 0.4], history: [], hist: -1, freedrive: false,
  };

  // ---- teletype ---------------------------------------------------------------------
  const tty = { q: [], typing: false };
  function say(text, kind = '') {
    for (const line of String(text).split('\n')) tty.q.push({ text: line.toUpperCase(), kind });
    if (!tty.typing) pump();
  }
  async function pump() {
    tty.typing = true;
    const el = $('tty');
    while (tty.q.length) {
      const { text, kind } = tty.q.shift();
      const li = document.createElement('div'); li.className = 'ln ' + kind;
      const ts = document.createElement('span'); ts.className = 'ts'; ts.textContent = clock();
      const tx = document.createElement('span'); li.append(ts, tx); el.appendChild(li);
      if (reduced || tty.q.length > 3) tx.textContent = text;
      else for (let i = 1; i <= text.length; i += 2) { tx.textContent = text.slice(0, i + 1); await sleep(11); }
      while (el.children.length > 40) el.firstChild.remove();
    }
    tty.typing = false;
  }

  // ---- api ------------------------------------------------------------------------
  async function post(url, body) {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    let j; try { j = await r.json(); } catch (e) { j = { ok: false, error: `HTTP ${r.status}` }; }
    if (!r.ok && j.ok !== false) j.ok = false;
    return j;
  }
  const why = (j) => j.error || j.reply || (j.safety && j.safety.violations && j.safety.violations.map((v) => v.message || v.kind || v).join('; '))
    || (j.protective_stop ? 'protective stop' : 'refused');

  // ---- WebGL2: the CRT feed + the point cloud ------------------------------------------
  const K_BARREL = 0.035;
  const barrel = (x, y) => { const cx = x - .5, cy = y - .5, r2 = (cx * cx + cy * cy) * 4, k = 1 + K_BARREL * r2; return [.5 + cx * k, .5 + cy * k]; };
  const unbarrel = (fx, fy) => {   // feed uv → screen uv (fixed-point on the forward map)
    let x = fx, y = fy;
    for (let i = 0; i < 4; i++) { const cx = x - .5, cy = y - .5, k = 1 + K_BARREL * (cx * cx + cy * cy) * 4; x = .5 + (fx - .5) / k; y = .5 + (fy - .5) / k; }
    return [x, y];
  };
  const glc = $('gl'), gl = glc.getContext('webgl2', { antialias: false, premultipliedAlpha: false });
  const scanc = $('scan'), sgl = scanc.getContext('webgl2', { antialias: true, premultipliedAlpha: false });
  const VS_QUAD = `#version 300 es
    in vec2 p; out vec2 vS; void main() { vS = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }`;
  const FS_CRT = `#version 300 es
    precision highp float; precision highp usampler2D;
    in vec2 vS; out vec4 o;
    uniform sampler2D uFeed, uMask; uniform usampler2D uDepth;
    uniform vec2 uRes, uFeedSize; uniform float uTime, uPower, uScale, uHasMask, uHasDepth, uHasFeed, uDpr, uAcq; uniform int uMode;
    const vec3 P0 = vec3(.006, .03, .016), P1 = vec3(.40, .95, .58), P2 = vec3(.86, 1., .9), AMB = vec3(1., .71, .28);
    float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    vec3 phos(float l) { vec3 c = mix(P0, P1, smoothstep(.02, .78, l)); return mix(c, P2, smoothstep(.72, 1., l)); }
    float luma(vec3 c) { return dot(c, vec3(.299, .587, .114)); }
    void main() {
      vec2 s = vec2(vS.x, 1. - vS.y);                       // screen uv, y down
      vec2 c = s - .5; float k = 1. + ${K_BARREL.toFixed(3)} * dot(c, c) * 4.;
      vec2 f = .5 + c * k;                                   // feed uv (the tube's curvature)
      float inside = step(0., f.x) * step(f.x, 1.) * step(0., f.y) * step(f.y, 1.);
      // power-on: a bright line opens into the picture
      float pw = clamp(uPower, 0., 1.), openY = smoothstep(.15, 1., pw), openX = smoothstep(0., .25, pw);
      float gate = step(abs(s.y - .5), max(.002, openY * .5)) * step(abs(s.x - .5), openX * .5);
      vec3 col = vec3(0.);
      if (uMode == 2 && uHasDepth > .5) {
        uint d = texture(uDepth, f).r; float z = float(d) * uScale;
        if (d == 0u) col = P0 * (.6 + .8 * hash(floor(f * uFeedSize * .5) + floor(uTime * 12.)));
        else {
          float t = z / .025, w = fwidth(t);   // an isoline every 25 mm, a heavier one every 100 mm
          float minor = 1. - clamp(abs(fract(t + .5) - .5) / max(w, 1e-4) - .2, 0., 1.);
          float major = 1. - clamp(abs(fract(z / .1 + .5) - .5) / max(fwidth(z / .1), 1e-4) - .3, 0., 1.);
          float near = 1. - smoothstep(.15, 1.6, z);
          col = phos(.12 + .35 * near) * .55 + P1 * minor * .55 + P2 * major * .8;
        }
      } else if (uHasFeed > .5) {
        vec3 rgb;
        if (uMode == 1) {   // TRUE: colour, a little convergence error
          vec2 ca = (f - .5) * .0025;
          rgb = vec3(texture(uFeed, f + ca).r, texture(uFeed, f).g, texture(uFeed, f - ca).b);
          vec3 bl = textureLod(uFeed, f, 4.).rgb;
          col = rgb * .92 + bl * .22;
        } else {            // VIS: one phosphor, bloom from the mip chain
          float l = luma(texture(uFeed, f).rgb);
          float b = luma(textureLod(uFeed, f, 3.).rgb) * .55 + luma(textureLod(uFeed, f, 5.).rgb) * .45;
          col = phos(l) + P1 * pow(b, 1.6) * .38;
        }
      }
      if (uHasMask > .5) {  // the target: amber tint, bright rim, a scan line sweeping it while acquiring
        vec2 px = 2. / uFeedSize;
        float m = texture(uMask, f).r;
        float e = abs(m - .25 * (texture(uMask, f + vec2(px.x, 0)).r + texture(uMask, f - vec2(px.x, 0)).r
                                + texture(uMask, f + vec2(0, px.y)).r + texture(uMask, f - vec2(0, px.y)).r));
        float sweep = uAcq < 1. ? smoothstep(.02, 0., abs(f.y - uAcq)) : 0.;
        col = mix(col, col * .45 + AMB * (.18 + .35 * luma(col)), m * .85) + AMB * clamp(e * 5., 0., 1.) * 1.3 + AMB * sweep * m;
      }
      // the tube: scanlines, grain, flicker, a slow rolling band, vignette
      float sl = .80 + .20 * pow(cos(gl_FragCoord.y / uDpr * 1.7), 2.);
      float grain = (hash(gl_FragCoord.xy + fract(uTime) * 91.) - .5) * .06;
      float roll = 1. + .045 * smoothstep(.06, 0., abs(fract(s.y - uTime * .06) - .5));
      float flick = .985 + .015 * sin(uTime * 97.);
      vec2 v = f * (1. - f); float vig = pow(clamp(v.x * v.y * 16., 0., 1.), .22);
      col = (col * sl * roll * flick + grain * P1) * vig;
      col += P2 * (1. - smoothstep(0., .02, pw)) * step(abs(s.y - .5), .004) * 2.;   // the power-on line
      o = vec4(col * inside * gate, 1.);
    }`;
  const VS_CLOUD = `#version 300 es
    precision highp float; precision highp usampler2D;
    uniform usampler2D uDepth; uniform sampler2D uMask; uniform vec4 uK; uniform ivec2 uSize; uniform int uStep, uCols;
    uniform float uScale, uDpr, uHasMask; uniform mat4 uMVP; uniform vec3 uC;
    out float vZ; out float vM;
    void main() {
      ivec2 p = ivec2((gl_VertexID % uCols) * uStep, (gl_VertexID / uCols) * uStep);
      uint d = texelFetch(uDepth, p, 0).r; float z = float(d) * uScale;
      vM = uHasMask > .5 ? texture(uMask, (vec2(p) + .5) / vec2(uSize)).r : 0.;
      vZ = z;
      vec3 X = vec3((float(p.x) - uK.z) / uK.x * z, (float(p.y) - uK.w) / uK.y * z, z);
      gl_Position = (d == 0u || z > 3.) ? vec4(9., 9., 9., 1.) : uMVP * vec4(X - uC, 1.);
      gl_PointSize = (1.25 + vM * 1.2) * uDpr;
    }`;
  const FS_CLOUD = `#version 300 es
    precision highp float; in float vZ; in float vM; out vec4 o; uniform float uTime, uZc;
    void main() {
      float near = clamp(1.25 - vZ / (uZc * 1.4), .12, 1.);
      float sweep = smoothstep(.035, 0., abs(fract(vZ * 2.2 - uTime * .35) - .5));
      vec3 c = mix(vec3(.40, .95, .58) * near, vec3(.86, 1., .9), sweep * .7);
      c = mix(c, vec3(1., .71, .28) * 1.2, vM);
      o = vec4(c, .30 + .55 * max(vM, sweep));
    }`;
  const VS_LINES = `#version 300 es
    in vec3 p; uniform mat4 uMVP; void main() { gl_Position = uMVP * vec4(p, 1.); }`;
  const FS_LINES = `#version 300 es
    precision highp float; out vec4 o; uniform float uA; void main() { o = vec4(.25, .65, .40, uA); }`;

  function program(g, vs, fs) {
    const mk = (type, src) => { const sh = g.createShader(type); g.shaderSource(sh, src); g.compileShader(sh);
      if (!g.getShaderParameter(sh, g.COMPILE_STATUS)) throw new Error(g.getShaderInfoLog(sh)); return sh; };
    const p = g.createProgram(); g.attachShader(p, mk(g.VERTEX_SHADER, vs)); g.attachShader(p, mk(g.FRAGMENT_SHADER, fs)); g.linkProgram(p);
    if (!g.getProgramParameter(p, g.LINK_STATUS)) throw new Error(g.getProgramInfoLog(p));
    const u = {}; const n = g.getProgramParameter(p, g.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const a = g.getActiveUniform(p, i); u[a.name] = g.getUniformLocation(p, a.name); }
    return { p, u };
  }
  function texture(g, integer) {
    const t = g.createTexture(); g.bindTexture(g.TEXTURE_2D, t);
    const filt = integer ? g.NEAREST : g.LINEAR;
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MIN_FILTER, filt); g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MAG_FILTER, filt);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_S, g.CLAMP_TO_EDGE); g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_T, g.CLAMP_TO_EDGE);

  ov.addEventListener('mousemove', (ev) => {
    const p = fromEvent(ev); S.hover = p;
    if (S.drag && p) { S.drag.u1 = p.u; S.drag.v1 = p.v; if (Math.abs(p.u - S.drag.u0) > 4 || Math.abs(p.v - S.drag.v0) > 4) S.drag.moved = true; }
  });
  ov.addEventListener('mouseleave', () => { S.hover = null; });
  ov.addEventListener('mousedown', (ev) => { if (ev.button !== 0) return; const p = fromEvent(ev); if (p) { S.drag = { u0: p.u, v0: p.v, u1: p.u, v1: p.v, moved: false }; ev.preventDefault(); } });
  window.addEventListener('mouseup', (ev) => {
    const d = S.drag; S.drag = null; if (!d) return;
    const p = fromEvent(ev); if (p) { d.u1 = p.u; d.v1 = p.v; }
    if (d.moved) segmentBox([Math.min(d.u0, d.u1), Math.min(d.v0, d.v1), Math.max(d.u0, d.u1) + 1, Math.max(d.v0, d.v1) + 1]);
    else if (ev.target === ov) segmentAt(d.u0, d.v0);
    $('cmd').focus();
  });

  // ---- robot ----------------------------------------------------------------------------
  const approach = () => (S.robot && S.robot.approach) || { standoff_m: 0.075, reference: 'fingertip' };
  async function locate(quiet) {
    if (!S.feat || !S.feat.point_m) { say('locate: no target with range', 'warn'); return null; }
    const a = approach(), j = await post('/api/robot/locate', { standoff_m: a.standoff_m, reference: a.reference });
    if (j.ok === false || !j.point_base_m) { say(`locate: ${why(j)}`, 'warn'); return null; }
    S.located = j; keys();
    if (!quiet || j.reachable === false) say(`base ${vec(j.point_base_m)} m · ${j.reachable === false ? 'out of reach' : (j.reachable ? 'in reach' : 'reach unknown')}`, j.reachable === false ? 'warn' : '');
    return j;
  }
  async function act(url, body, label) {
    const j = await post(url, body || {});
    if (j.ok === false) say(`${label}: ${why(j)}`, 'crit'); else say(`${label}: ${j.dry_run ? 'dry run — validated, nothing sent' : 'done'}`);
    events(); state(); return j;
  }
  async function approachCycle() {
    if (!S.feat || !S.feat.point_m) { say('approach: acquire a target first', 'warn'); return; }
    const a = approach();
    say(`approach · over, down to ${(a.standoff_m * 1000).toFixed(0)} mm from the ${a.reference === 'fingertip' ? 'fingertips' : a.reference}, back`);
    $('kGo').disabled = true;
    try {
      const j = await post('/api/robot/approach_cycle', { standoff_m: a.standoff_m, reference: a.reference });
      if (j.locate) S.located = j.locate;
      if (j.ok) say(j.dry_run ? 'approach: dry run — validated, nothing sent' : `approach complete · ${(j.legs || []).map((l, i) => `${['over', 'down', 'up', 'back'][i] || i} ${l.ok ? 'ok' : 'missed'}`).join(' · ')}`);
      else say(`approach refused: ${why(j)}${j.completed_legs ? ` after ${j.completed_legs} legs` : ''}`, 'crit');
    } finally { keys(); events(); state(); }
  }
  function moveTo() {
    const loc = S.located;
    if (!loc || !loc.approach_pose) { say('move: locate a target first', 'warn'); return; }
    if (loc.reachable === false) { say('move: target is out of reach', 'crit'); return; }
    ask(`move tcp to ${vec(loc.approach_pose)} on ${S.robot.host}${S.robot.dry_run ? ' (dry run)' : ''}?`, async () => {
      const j = await post('/api/robot/move', { pose: loc.approach_pose });
      if (j.ok) say(j.dry_run ? 'move: dry run — validated' : `move: landed ${vec(j.landed)}`); else say(`move refused: ${why(j)}`, 'crit');
      state();
    });
  }
  function ask(question, fn) { S.confirm = fn; say(`${question}  Y / N`, 'warn'); }
  async function stop() { say('ALL STOP', 'crit'); await act('/api/robot/stop', {}, 'stop'); }

  const lamp = (id, cls) => { $(id).className = 'lamp ' + (cls || ''); };
  async function state() {
    if (!S.robot) return;
    const j = await post('/api/robot/state').catch((e) => ({ ok: false, error: e.message }));
    const was = S.state; S.state = j;
    if (j.ok === false && !j.robot_mode) {
      lamp('lLink', 'crit'); lamp('lPwr'); lamp('lSafe'); lamp('lRmt');
      if (!was || was.ok !== false) say(`controller not answering: ${why(j)}`, 'crit');
      return;
    }
    const rm = (j.robot_mode || '').replace('Robotmode: ', ''), sm = (j.safety_mode || '').replace('Safetymode: ', ''), cm = j.control_mode || '';
    const safe = /NORMAL|REDUCED/.test(sm);
    lamp('lLink', 'on'); lamp('lPwr', rm === 'RUNNING' ? 'on' : 'alert'); lamp('lSafe', safe ? 'on' : 'crit'); lamp('lRmt', cm === 'REMOTE' ? 'on' : 'alert');
    if (was && was.ok !== false) {
      const wrm = (was.robot_mode || '').replace('Robotmode: ', ''), wsm = (was.safety_mode || '').replace('Safetymode: ', '');
      if (wrm !== rm) say(`robot ${wrm || '?'} → ${rm}`, rm === 'RUNNING' ? '' : 'warn');
      if (wsm !== sm) say(`safety ${wsm || '?'} → ${sm}`, safe ? '' : 'crit');
      if ((was.control_mode || '') !== cm) say(`control ${was.control_mode || '?'} → ${cm}${cm === 'REMOTE' ? '' : ' · motion needs remote'}`, cm === 'REMOTE' ? '' : 'warn');
    } else if (!was) {
      say(`robot ${rm} · safety ${sm} · control ${cm}`, (rm === 'RUNNING' && safe && cm === 'REMOTE') ? '' : 'warn');
      if (cm && cm !== 'REMOTE') say('switch the pendant to REMOTE to move', 'warn');
    }
  }
  async function events() {
    try {
      const j = await (await fetch(`/api/events?after=${S.lastEvent}`)).json();
      for (const e of j.events || []) {
        if (S.lastEvent) say(`${e.kind} · ${e.message}`, e.ok === false ? 'warn' : 'dim');
        S.lastEvent = e.seq;
      }
    } catch (e) {}
  }
  function keys() {
    const armed = !!(S.robot && S.feat && S.feat.point_m && !(S.located && S.located.reachable === false));
    $('kGo').disabled = !armed;
    for (const id of ['kStart', 'stopKey']) $(id).disabled = !S.robot;
  }

  // ---- the prompt -------------------------------------------------------------------------
  const HELP = [
    'START          power on + brake release',
    'STOP           stop all motion (esc esc)',
    'FIND           the nearest object · or click / drag on the picture',
    'CLEAR          drop the target',
    'LOCATE         the target in the base frame + reach',
    'APPROACH       over the target, down to the standoff, back',
    'MOVE           the tcp to the approach pose (asks)',
    'OPEN · CLOSE   the gripper',
    'FREE [ON|OFF]  freedrive (hand-guide)',
    'JOG X+ 10      a base-frame nudge, mm (≤ 50)',
    'VIS · TRUE · RANGE   the picture: phosphor, colour, depth contours',
    'SNAP           write a snapshot · STATUS · DOCTOR · PAUSE · CLASSIC',
  ];
  const COMMANDS = {
    HELP: () => say(HELP.join('\n'), 'dim'),
    START: () => act('/api/robot/bring_up', {}, 'start'),
    STOP: stop, HALT: stop,
    FIND: nearest, NEAREST: nearest,
    CLEAR: clearTarget,
    LOCATE: () => locate(false),
    APPROACH: approachCycle, GO: approachCycle,
    MOVE: moveTo,
    OPEN: () => act('/api/robot/gripper', { action: 'open' }, 'gripper open'),
    CLOSE: async () => { const j = await act('/api/robot/gripper', { action: 'close' }, 'gripper close'); if (j.ok) say(j.object_detected ? 'gripper: holding' : 'gripper: closed on nothing', j.object_detected ? '' : 'warn'); },
    FREE: async (arg) => {
      const on = arg ? arg === 'ON' : !S.freedrive;
      const j = await act('/api/robot/freedrive', { enable: on }, `freedrive ${on ? 'on' : 'off'}`); if (j.ok !== false) S.freedrive = on;
    },
    JOG: (axis, mm) => {
      const m = /^([XYZ])([+-])$/.exec(axis || ''), step = Math.min(50, Math.abs(parseFloat(mm) || 10));
      if (!m) { say('jog: axis like X+ Y- Z+', 'warn'); return; }
      const d = [0, 0, 0, 0, 0, 0]; d['XYZ'.indexOf(m[1])] = (m[2] === '+' ? 1 : -1) * step / 1000;
      return act('/api/robot/jog', { delta: d }, `jog ${axis} ${step} mm`);
    },
    VIS: () => mode('VIS'), TRUE: () => mode('TRUE'), COLOR: () => mode('TRUE'), COLOUR: () => mode('TRUE'), RANGE: () => mode('RANGE'), DEPTH: () => mode('RANGE'),
    SNAP: async () => { const j = await post('/api/snapshot', {}); say(j.ok ? `snapshot → ${j.color_png}` : `snap: ${why(j)}`, j.ok ? 'dim' : 'warn'); },
    STATUS: () => { S.state = null; state(); },
    DOCTOR: async () => {
      say('pre-flight…', 'dim');
      try {
        const j = await (await fetch('/api/doctor')).json();
        for (const c of j.checks) say(`${c.ok === true ? 'ok  ' : (c.ok === false ? 'FAIL' : '--  ')} ${c.name} · ${c.detail}${c.ok === false && c.fix ? ` · fix: ${c.fix}` : ''}`, c.ok === false ? 'crit' : (c.ok ? 'dim' : 'warn'));
        say(j.motion_ok ? 'ready for motion' : (j.ok ? 'state only' : 'not ready'), j.motion_ok ? '' : 'warn');
      } catch (e) { say(`doctor: ${e.message}`, 'crit'); }
    },
    PAUSE: () => { S.running = !S.running; say(S.running ? 'feed resumed' : 'feed paused', 'dim'); },
    CLASSIC: () => { location.href = '/classic'; },
  };
  function mode(m) { S.mode = m; document.querySelectorAll('#modes span').forEach((s) => s.classList.toggle('sel', s.dataset.m === m)); }
  document.querySelectorAll('#modes span').forEach((s) => s.onclick = () => mode(s.dataset.m));

  async function run(line) {
    const words = line.trim().toUpperCase().split(/\s+/).filter(Boolean);
    if (!words.length) return;
    say(`> ${words.join(' ')}`, 'you');
    if (S.confirm) {
      const fn = S.confirm; S.confirm = null;
      if (words[0] === 'Y' || words[0] === 'YES') { await fn(); } else say('cancelled', 'dim');
      return;
    }
    const cmd = COMMANDS[words[0]];
    if (!cmd) { say(`unknown command ${words[0]} · HELP`, 'warn'); return; }
    const needsRobot = !['HELP', 'FIND', 'NEAREST', 'CLEAR', 'VIS', 'TRUE', 'COLOR', 'COLOUR', 'RANGE', 'DEPTH', 'SNAP', 'DOCTOR', 'PAUSE', 'CLASSIC'].includes(words[0]);
    if (needsRobot && !S.robot) { say('no robot linked to this cockpit (--no-robot)', 'warn'); return; }
    try { await cmd(...words.slice(1)); } catch (e) { say(`${words[0]}: ${e.message}`, 'crit'); }
  }
  const input = $('cmd');
  let escAt = 0;
  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { const v = input.value; input.value = ''; if (v.trim()) { S.history.push(v); S.hist = S.history.length; } run(v); }
    else if (ev.key === 'ArrowUp') { if (S.hist > 0) { S.hist--; input.value = S.history[S.hist]; ev.preventDefault(); } }
    else if (ev.key === 'ArrowDown') { if (S.hist < S.history.length) { S.hist++; input.value = S.history[S.hist] || ''; } }
    else if (ev.key === 'Tab') {
      ev.preventDefault(); const v = input.value.trim().toUpperCase();
      const hits = Object.keys(COMMANDS).filter((k) => k.startsWith(v)); if (hits.length === 1) input.value = hits[0] + ' '; else if (hits.length) say(hits.join('  '), 'dim');
    } else if (ev.key === 'Escape') {
      const now = performance.now();
      if (now - escAt < 600 && S.robot) { stop(); escAt = 0; } else { escAt = now; input.value = ''; if (S.confirm) { S.confirm = null; say('cancelled', 'dim'); } }
    }
  });
  document.addEventListener('keydown', (ev) => { if (document.activeElement !== input && ev.key.length === 1 && !ev.metaKey && !ev.ctrlKey) input.focus(); });
  $('kStart').onclick = () => run('START'); $('kFind').onclick = () => run('FIND'); $('kGo').onclick = () => run('APPROACH'); $('stopKey').onclick = stop;

  // ---- info + boot --------------------------------------------------------------------------
  let booted = false;
  async function info() {
    try {
      const j = await (await fetch('/api/info')).json(), c = j.camera || {}, d = c.device || {}, cell = j.cell || {};
      S.robot = j.robot;
      lamp('lCam', c.open ? (c.kind === 'synthetic' ? 'alert' : 'on') : 'crit');
      $('ident').textContent = [cell.UR_CELL ? `CELL ${cell.UR_CELL}` : null, S.robot ? `${S.robot.platform || ''} ${S.robot.host}${S.robot.dry_run ? ' · DRY RUN' : ''}` : 'NO ROBOT',
        d.name ? `${d.name}${d.serial ? ' ' + d.serial : ''}` : c.kind].filter(Boolean).join('  /  ');
      (j.views || []).slice(0, 2).forEach((v, i) => { $(`view${i}`).hidden = false; $(`view${i}Name`).textContent = v.name || `VIEW ${i + 1}`; viewLoop(i); });
      if (!S.robot) { lamp('lLink'); lamp('lPwr'); lamp('lSafe'); lamp('lRmt'); }
      keys();
      if (!booted) {
        booted = true;
        say(`${d.name || c.kind || 'camera'} ${c.open ? 'online' : 'offline'}${c.lean ? ' · lean open' : ''} · segmenter ${j.segmenter || '?'}`, c.open ? 'dim' : 'warn');
        if (S.robot) say(`hand-eye ${(S.robot.handeye || {}).source || '?'} · approach from the ${approach().reference === 'fingertip' ? 'fingertips' : approach().reference}, ${(approach().standoff_m * 1000).toFixed(0)} mm`, 'dim');
        state();
      }
    } catch (e) { lamp('lCam', 'crit'); }
  }
  say('interface online', 'dim');
  say('click the picture to acquire a target · HELP for commands', 'dim');
  setInterval(() => { $('clock').textContent = clock(); }, 1000);
  info(); setInterval(info, 3000);
  setInterval(state, 2500); events(); setInterval(events, 1500);
  frames(); requestAnimationFrame(frame);
  input.focus();
})();
</script>
</body>
</html>
